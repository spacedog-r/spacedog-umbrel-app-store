version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: spacedog-openclaw_gateway_1
      APP_PORT: 18789

  gateway:
    image: ghcr.io/openclaw/openclaw:2026.10.4
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: "${APP_SPACEDOG_OPENCLAW_GATEWAY_TOKEN}"
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Europe/Amsterdam
    volumes:
      - ${APP_DATA_DIR}/data/state:/home/node/.openclaw
      - ${APP_DATA_DIR}/data/auth:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
